[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epicoge"
version = "1.0.0"
description = "Antibody-specific epitope prediction through geometry and contact-assisted node readout"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "numpy>=1.26", "biopython>=1.85", "PyYAML>=6.0", "fair-esm==2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
